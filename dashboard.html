
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - My Hosting Platform</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        header {
            background: #1e293b;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            color: #38bdf8;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
        }

        .card {
            background: #1e293b;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
        }

        h2 {
            color: #38bdf8;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            background: #334155;
            color: white;
        }

        button {
            padding: 13px 22px;
            border: none;
            border-radius: 8px;
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0ea5e9;
        }

        .project {
            background: #334155;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .back {
            display: inline-block;
            margin-top: 15px;
            color: #38bdf8;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Hosting Platform</h1>
        <p>User Dashboard</p>
    </header>

    <div class="container">

        <div class="card">
            <h2>Welcome to Your Dashboard</h2>

            <p>
                Manage your hosting projects from here.
            </p>
        </div>

        <div class="card">

            <h2>Create New Hosting</h2>

            <form onsubmit="createHosting(event)">

                <label>Project Name</label>

                <input
                    type="text"
                    id="projectName"
                    placeholder="Enter project name"
                    required
                >

                <label>Project Type</label>

                <select id="projectType" required>
                    <option value="">Select project type</option>
                    <option value="HTML Website">HTML Website</option>
                    <option value="Python App">Python App</option>
                    <option value="Node.js App">Node.js App</option>
                    <option value="Telegram Bot">Telegram Bot</option>
                </select>

                <button type="submit">
                    Create Hosting
                </button>

            </form>

        </div>

        <div class="card">

            <h2>My Hosting Projects</h2>

            <div id="projects">
                <p>No hosting projects created yet.</p>
            </div>

        </div>

        <a class="back" href="index.html">
            ← Back to Home
        </a>

    </div>

    <script>
        function createHosting(event) {
            event.preventDefault();

            const name = document.getElementById("projectName").value;
            const type = document.getElementById("projectType").value;

            const projects = document.getElementById("projects");

            projects.innerHTML = `
                <div class="project">
                    <h3>${name}</h3>
                    <p>Type: ${type}</p>
                    <p>Status: Demo Created</p>
                    <p>Live URL: Not available yet</p>
                </div>
            `;

            alert(
                "Demo project created. Real hosting server is not connected yet."
            );
        }
    </script>

</body>
</html>
